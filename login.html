
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ClassCyberPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="w-full max-w-sm mx-auto text-center mb-6">
        <div class="text-5xl text-cyan-400 mb-3 animate-pulse">
            <i class="fa-solid fa-user-astronaut"></i>
        </div>
        <h1 class="text-2xl font-normal text-white">Đăng nhập vào ClassCyberPulse</h1>
    </div>

    <!-- Khung đăng nhập -->
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
        
        <!-- Form nhập thủ công -->
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Tên người dùng hoặc địa chỉ email</label>
                <input type="text" id="login-identifier" placeholder="Nhập email hoặc tên của bạn..." class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
            </div>

            <button onclick="handleEmailLogin()" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md font-bold text-sm transition cursor-pointer shadow-md">
                Đăng nhập
            </button>
        </div>

        <!-- Đường kẻ HOẶC -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-xs uppercase">hoặc</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Nút Tiếp tục với Google tự động 1 chạm -->
        <div class="space-y-3">
            <button onclick="handleGoogleOneTap()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md font-semibold text-sm text-white transition cursor-pointer flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-brands fa-google text-red-400"></i> Tiếp tục với Google
            </button>
        </div>

    </div>

    <!-- Modal cập nhật lớp nếu email chưa có trong danh sách Admin -->
    <div id="custom-register-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2">Cập nhật thông tin học sinh</h3>
            <p class="text-xs text-slate-400 mb-4">Tài khoản Google này chưa có trong danh sách lớp của Admin. Vui lòng bổ sung thông tin:</p>
            
            <div class="space-y-3 mb-4 text-left">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Họ và tên:</label>
                    <input type="text" id="modal-name" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Lớp (Ví dụ: 11A1):</label>
                    <input type="text" id="modal-class" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Trường:</label>
                    <input type="text" id="modal-school" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeModal()" class="w-1/2 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-bold transition">Hủy</button>
                <button onclick="saveCustomUser()" class="w-1/2 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-bold transition">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Quay lại -->
    <div class="mt-8 text-center">
        <a href="index.html" class="text-xs text-slate-400 hover:text-cyan-400 transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang chủ
        </a>
    </div>

    <script>
        // Danh sách lớp mẫu do Admin quản lý
        const adminClassDatabase = {
            "admin.11a1@school.edu.vn": "11A1 - THPT Chuyên",
            "nguyenvanan@gmail.com": "12C3 - THPT Lê Quý Đôn",
            "buinhim239@gmail.com": "12A1 - THPT Chuyên" // Đã thêm email của bạn vào đây để test thử
        };

        let pendingEmail = "";

        function processLogin(identifier) {
            if (!identifier) return;
            identifier = identifier.trim().toLowerCase();
            let assignedClass = adminClassDatabase[identifier];
            let rawName = identifier.includes('@') ? identifier.split('@')[0] : identifier;
            let formattedName = rawName.split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');

            if (!assignedClass) {
                pendingEmail = identifier;
                document.getElementById("modal-name").value = formattedName;
                document.getElementById("custom-register-modal").classList.remove("hidden");
                return;
            }

            let userData = {
                name: formattedName,
                classRoom: assignedClass,
                score: 0,
                isGoogleGuest: true,
                email: identifier
            };

            localStorage.setItem("cyberUser", JSON.stringify(userData));
            window.location.href = "index.html";
        }

        function handleEmailLogin() {
            let inputVal = document.getElementById("login-identifier").value;
            processLogin(inputVal);
        }

        // Tự động nhận diện tài khoản Google nhanh 1 chạm (Lấy thẳng email mẫu đang thao tác trên máy hoặc gợi ý siêu tốc)
        function handleGoogleOneTap() {
            // Giả lập lấy nhanh email đang mở trên trình duyệt của bạn (Ví dụ: buinhim239@gmail.com từ ảnh chụp màn hình của bạn)
            let detectedEmail = "buinhim239@gmail.com"; 
            
            let confirmUse = confirm(`Xác nhận tiếp tục nhanh bằng tài khoản Google:\n👉 ${detectedEmail}`);
            if (confirmUse) {
                processLogin(detectedEmail);
            }
        }

        function closeModal() {
            document.getElementById("custom-register-modal").classList.add("hidden");
        }

        function saveCustomUser() {
            let name = document.getElementById("modal-name").value.trim();
            let className = document.getElementById("modal-class").value.trim();
            let school = document.getElementById("modal-school").value.trim();

            if (!name) {
                alert("Vui lòng nhập tên của bạn!");
                return;
            }

            let fullClass = (className ? className : "Chưa rõ lớp") + (school ? " - " + school : "");

            let userData = {
                name: name,
                classRoom: fullClass,
                score: 0,
                isGoogleGuest: false,
                email: pendingEmail
            };

            localStorage.setItem("cyberUser", JSON.stringify(userData));
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
